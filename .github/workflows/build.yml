name: Build Orbital 33 Icon Pack
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify project files
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/orbital33/iconpack/MainActivity.java
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path("app/src/main/res")
          tree = ET.parse(root / "xml/appfilter.xml")
          items = tree.getroot().findall("item")
          assert items, "appfilter.xml has no icon mappings"
          seen = set()
          for item in items:
              component = item.attrib.get("component", "")
              drawable = item.attrib.get("drawable", "")
              assert component.startswith("ComponentInfo{") and component.endswith("}"), f"Invalid component: {component}"
              assert component not in seen, f"Duplicate component: {component}"
              seen.add(component)
              assert drawable, f"Missing drawable attribute for {component}"
              assert (root / "drawable" / (drawable + ".xml")).is_file(), f"Missing drawable resource: {drawable}"
          print(f"Validated {len(items)} unique app mappings and all drawable resources")
          catalog = ET.parse(root / "xml/drawable.xml").getroot().findall("item")
          assert len(catalog) == 1500, f"Expected 1500 catalog icons, found {len(catalog)}"
          catalog_names = [item.attrib.get("drawable", "") for item in catalog]
          assert len(set(catalog_names)) == 1500, "Duplicate catalog drawable"
          for drawable in catalog_names:
              assert (root / "drawable" / (drawable + ".xml")).is_file(), f"Missing catalog drawable: {drawable}"
          print(f"Validated {len(catalog)} additional catalog icons and their drawable resources")
          PY
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orbital-33-Icon-Pack-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-v0.1.0
          name: Orbital 33 Icon Pack Preview v0.1.0
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/app-debug.apk
